<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events &amp; Updates | Northside Fitness Hub</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <p class="brand">Northside Fitness Hub</p>
      <h1>Events &amp; Updates</h1>
    </div>
  </header>

  <main class="container">
    <section id="announcements" class="banner" aria-label="Announcements">
      <p class="placeholder">Loading…</p>
    </section>

    <div class="layout">
      <section class="card hours-card" aria-labelledby="hours-title">
        <h2 id="hours-title">Opening Hours</h2>
        <ul id="hours" class="hours-list">
          <li class="placeholder">Loading…</li>
        </ul>
      </section>

      <section class="events" aria-labelledby="events-title">
        <h2 id="events-title">Upcoming Classes &amp; Workshops</h2>
        <div id="events" class="events-grid">
          <p class="placeholder">Loading…</p>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Northside Fitness Hub</p>
    </div>
  </footer>
</body>
</html>
